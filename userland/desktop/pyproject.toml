[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ainos-desktop"
version = "0.1.0"
description = "A cross-platform desktop GUI for the Ainos AI backend"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Ainos Team", email = "dev@ainos.ai"},
]
keywords = ["ai", "desktop", "qt", "pyside6", "machine-learning"]

dependencies = [
    "PySide6>=6.6.0",
    "pyqtgraph>=0.13.3",
    "psutil>=5.9.0",
    "aiohttp>=3.9.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-qt>=4.2",
    "pytest-asyncio>=0.21",
    "flake8>=6.0",
    "black>=23.0",
    "mypy>=1.0",
]

[project.scripts]
ainos-desktop = "main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ainos*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.mypy]
strict = true
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_unimported = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]