# Ainos AI Daemon Configuration
# 配置文件路径: /etc/ainos/ai-daemon.conf

# ============================================
# 基本配置
# ============================================

# 模型存储目录
models_dir = "/var/lib/ainos/models"

# 默认模型名称 (GGUF 格式)
default_model = "phi-3-mini-4k-instruct-q4.gguf"

# IPC Socket 路径
socket_path = "/var/run/ainos/ai-daemon.sock"

# ============================================
# 本地推理配置
# ============================================

# 是否启用本地推理
enable_local = true

# 本地推理引擎 (ggml / onnx)
local_engine = "ggml"

# 最大并行推理数
max_concurrent_inferences = 2

# 模型缓存大小 (MB)
model_cache_size_mb = 4096

# 推理超时 (秒)
inference_timeout_secs = 120

# ============================================
# 云端回退配置
# ============================================

# 是否启用云端回退
enable_cloud = true

# 云端 API 端点 (兼容 OpenAI API)
cloud_api_url = "https://api.weelinking.com/v1"

# 云端 API Key (从环境变量读取更安全)
cloud_api_key = ""

# 云端模型名称
cloud_model = "gpt-5.6-sol"

# 网络检测间隔 (秒)
network_check_interval = 30

# 切换阈值 (本地推理置信度低于此值则用云端)
cloud_fallback_confidence = 0.6

# ============================================
# 上下文管理
# ============================================

# 上下文存储目录
context_dir = "/var/lib/ainos/contexts"

# 最大上下文数
max_contexts = 1000

# 上下文 TTL (天)
context_ttl_days = 30

# ============================================
# 日志和安全
# ============================================

# 日志级别 (trace/debug/info/warn/error)
log_level = "info"

# 审计日志路径
audit_log = "/var/log/ainos/audit.log"

# 是否记录所有推理请求
audit_all_requests = false