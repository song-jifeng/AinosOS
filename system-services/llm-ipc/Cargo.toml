[package]
name = "llm-ipc"
version = "0.1.0"
description = "LLM-as-IPC - process communication via natural language"
authors = ["Ainos OS Team"]
license = "MIT"
edition = "2021"

[[bin]]
name = "llm-ipc"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
colored = "2"