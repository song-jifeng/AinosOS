[package]
name = "ainos-ai-daemon"
version = "0.1.0"
edition = "2021"
description = "Ainos OS AI System Daemon - Core AI service manager"

[[bin]]
name = "ai-daemon"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Utilities
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"
lru = "0.12"

# HTTP client (cloud fallback)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures = "0.3"

# IPC security & authentication
zeroize = { version = "1", features = ["derive"] }
rand = "0.8"

# Random number generation (for sampling in runtime)
fastrand = "2"

# Half-precision float (FP16 support for GGML)
half = { version = "2", optional = true }

# Tokenization (optional, for real tokenizer via tokenizers crate)
tokenizers = { version = "0.19", optional = true }

# SQLite persistence (optional)
rusqlite = { version = "0.31", features = ["bundled"], optional = true }

# TLS support (optional)
rustls = { version = "0.23", optional = true }
tokio-rustls = { version = "0.26", optional = true }
rcgen = { version = "0.13", optional = true }
pem = { version = "3", optional = true }

# Windows named pipe IPC (Windows only)
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
    "winbase",
    "winnt",
    "handleapi",
    "synchapi",
    "ioapiset",
    "errhandlingapi",
    "minwinbase",
    "securitybaseapi",
    "accctrl",
    "aclapi",
    "fileapi",
    "namedpipeapi",
    "processthreadsapi",
    "winreg",
    "winuser",
    "winsvc",
    "evntprov",
    "evntrace",
    "shellapi",
    "psapi",
    "tlhelp32",
    "strsafe",
    "combaseapi",
] }

[features]
default = []

# Database features
sqlite-persistence = ["rusqlite"]

# TLS / transport security
tls = ["rustls", "tokio-rustls", "rcgen", "pem"]

# AI engine features
ggml = ["half"]            # Real GGML inference via FFI
onnx = []                   # ONNX Runtime integration
cuda = ["ggml"]             # CUDA GPU acceleration (requires ggml)
vulkan = ["ggml"]           # Vulkan GPU acceleration (requires ggml)

# Full feature set
full = ["ggml", "onnx", "sqlite-persistence", "tls"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"

[profile.dev]
debug = true
opt-level = 0