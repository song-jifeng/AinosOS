[build-system]
requires = ["setuptools>=68.0.0", "wheel>=0.40.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "ai-compiler"
version = "1.0.0"
description = "AI Compiler Toolchain - 支持 AI 自动调优的编译器工具链"
readme = "README.md"
authors = [
    {name = "AI Compiler Team", email = "team@ai-compiler.dev"}
]
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["compiler", "ai", "optimization", "machine learning", "code generation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Compilers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
    "flake8>=6.0.0",
]
ai = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[project.urls]
Documentation = "https://ai-compiler.dev/docs"
Source = "https://github.com/ai-compiler/compiler"
"Bug Tracker" = "https://github.com/ai-compiler/compiler/issues"

[project.scripts]
aicompiler = "src.compiler:Compiler.run_command_line"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.flake8]
max-line-length = 100
extend-ignore = "E203, W503"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]