# ============================================================
# Model Configuration
# ============================================================
model:
  name: "Llama 3 8B"
  family: "llama"
  architecture: "decoder-only"
  version: "3.0"
  description: "Meta's Llama 3 large language model with 8 billion parameters, featuring improved tokenizer and GQA"

# ============================================================
# Source Information
# ============================================================
source:
  huggingface_repo: "meta-llama/Meta-Llama-3-8B"
  default_branch: "main"
  license: "llama3"
  paper_url: "https://arxiv.org/abs/2407.21783"
  author: "Meta AI"

# ============================================================
# Architecture Details
# ============================================================
architecture:
  num_layers: 32
  num_attention_heads: 32
  num_kv_heads: 8
  hidden_size: 4096
  intermediate_size: 14336
  vocab_size: 128256
  max_position_embeddings: 8192
  normalization: "RMSNorm"
  activation_function: "SiLU"
  attention_type: "grouped-query-attention"
  positional_encoding: "RoPE"
  feed_forward: "SwiGLU"
  embedding_dim: 4096
  head_dim: 128
  rope_theta: 500000.0
  rope_scaling: null
  tie_word_embeddings: false
  weight_tying: false

# ============================================================
# Model Dimensions
# ============================================================
dimensions:
  total_params: "8B"
  non_embedding_params: "7.6B"
  embedding_params: "0.4B"
  model_size_gb: 16.0
  quantized_sizes:
    q4_0: 4.8
    q4_1: 5.3
    q5_0: 5.9
    q5_1: 6.4
    q8_0: 8.2
    f16: 16.0

# ============================================================
# Default Quantization
# ============================================================
quantization:
  default: "Q4_0"
  supported:
    - "Q4_0"
    - "Q4_1"
    - "Q5_0"
    - "Q5_1"
    - "Q8_0"
    - "F16"
  recommended: "Q5_0"
  performance_rank:
    Q4_0: "fastest, lowest quality"
    Q4_1: "slightly better quality than Q4_0"
    Q5_0: "good balance of quality and speed"
    Q5_1: "better quality than Q5_0"
    Q8_0: "near-lossless"
    F16: "lossless"

# ============================================================
# Recommended Parameters
# ============================================================
parameters:
  inference:
    temperature: 0.6
    top_p: 0.9
    top_k: 50
    repetition_penalty: 1.1
    max_tokens: 4096
    stop_sequences: ["<|eot_id|>", "<|end_of_text|>"]
  context_length: 8192
  batch_size: 1
  threads: 4
  gpu_layers: 0

# ============================================================
# Memory Requirements
# ============================================================
memory:
  minimum_ram_gb: 8
  recommended_ram_gb: 16
  minimum_vram_gb: 8
  recommended_vram_gb: 16
  swap_gb: 4
  disk_space_gb: 24
  breakdown:
    model_weights_gb: 16.0
    kv_cache_gb: 3.0
    overhead_gb: 2.0

# ============================================================
# Performance Benchmarks
# ============================================================
benchmarks:
  inference_speed:
    cpu:
      q4_0: { tokens_per_second: 22, prompt_processing: "6s for 512 tokens" }
      q8_0: { tokens_per_second: 13, prompt_processing: "10s for 512 tokens" }
      f16: { tokens_per_second: 7, prompt_processing: "18s for 512 tokens" }
    gpu:
      q4_0: { tokens_per_second: 75, prompt_processing: "1.2s for 512 tokens" }
      q8_0: { tokens_per_second: 55, prompt_processing: "1.8s for 512 tokens" }
      f16: { tokens_per_second: 40, prompt_processing: "2.5s for 512 tokens" }
  memory_usage:
    cpu:
      q4_0: { peak_ram_gb: 7, steady_ram_gb: 5 }
      q8_0: { peak_ram_gb: 10, steady_ram_gb: 8.5 }
      f16: { peak_ram_gb: 18, steady_ram_gb: 16 }
    gpu:
      q4_0: { peak_vram_gb: 6, peak_ram_gb: 2 }
      q8_0: { peak_vram_gb: 9, peak_ram_gb: 2 }
      f16: { peak_vram_gb: 17, peak_ram_gb: 2 }

# ============================================================
# Conversion Options
# ============================================================
conversion:
  supported_formats:
    - "gguf"
    - "onnx"
  default_format: "gguf"
  quantization_types:
    - "q4_0"
    - "q4_1"
    - "q5_0"
    - "q5_1"
    - "q8_0"
    - "f16"
  optimization_options:
    fuse_attention: true
    fuse_ffn: true
    prune_unused: false
  gguf_metadata:
    model_type: "llama"
    file_version: 3
    tensor_data_layout: "default"

# ============================================================
# Hardware Requirements
# ============================================================
hardware:
  minimum:
    cpu: "x86_64, 4 cores"
    ram: "8 GB"
    disk: "SSD, 24 GB free"
  recommended:
    cpu: "x86_64, 8 cores with AVX2"
    ram: "16 GB"
    gpu: "NVIDIA RTX 3060 12GB or better"
    disk: "NVMe SSD, 50 GB free"
  supported_backends:
    - "cpu"
    - "cuda"
    - "vulkan"
    - "metal"

# ============================================================
# Dependencies
# ============================================================
dependencies:
  required:
    - "torch>=2.0.0"
    - "numpy>=1.24.0"
    - "safetensors>=0.3.0"
  optional:
    - "xformers>=0.0.20"
    - "flash-attn>=2.0.0"
    - "transformers>=4.40.0"
    - "accelerate>=0.20.0"

# ============================================================
# Registry Metadata
# ============================================================
registry:
  tags: ["llm", "text-generation", "meta"]
  category: "text-generation"
  tasks: ["text-generation", "conversational"]
  languages: ["en"]
  featured: true
  created: "2024-04-18"
  updated: "2024-06-01"