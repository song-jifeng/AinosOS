name: "DeepSeek Coder V2"
description: "DeepSeek Coder V2 - 专注于代码生成和理解的大语言模型，MoE 架构"
version: "2.0.0"
model_type: "llm"
architecture: "deepseek2"
context_length: 131072
parameters: "236B (MoE)"

architecture_detail:
