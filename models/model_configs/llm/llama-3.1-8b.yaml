name: "LLaMA 3.1 8B"
description: "Meta LLaMA 3.1 8B - 高效通用大语言模型，支持多语言和多轮对话"
version: "3.1.0"
model_type: "llm"
architecture: "llama"
context_length: 131072
parameters: "8B"

# 模型架构
architecture_detail:
  num_layers: 32
  num_heads: 32
  num_kv_heads: 8
  hidden_size: 4096
  intermediate_size: 14336
  vocab_size: 128256
  rope_theta: 500000.0
  norm_type: "rms_norm"
  activation: "silu"

# 分词器
tokenizer:
  type: "tiktoken"
  vocab_size: 128256
  add_bos: true
  add_eos: true

# 量化选项
quantization:
  - type: "Q8_0"
    size_gb: 9.2
  - type: "Q6_K"
    size_gb: 7.0
  - type: "Q5_K_M"
    size_gb: 6.0
  - type: "Q5_0"
    size_gb: 5.8
  - type: "Q4_K_M"
    size_gb: 5.0
  - type: "Q4_K_S"
    size_gb: 4.7
  - type: "Q4_0"
    size_gb: 4.5
  - type: "Q3_K_M"
    size_gb: 3.8
  - type: "Q2_K"
    size_gb: 3.0

# 推荐设置
recommended:
  temperature: 0.6
  top_p: 0.9
  top_k: 40
  repeat_penalty: 1.1
  num_threads: 8
  batch_size: 64
  context_size: 8192
  flash_attention: true

# 特殊 Token
special_tokens:
  bos_token: "<|begin_of_text|>"
  eos_token: "<|end_of_text|>"
  pad_token: "<|end_of_text|>"
  system_token: "<|start_header_id|>system<|end_header_id|>"
  user_token: "<|start_header_id|>user<|end_header_id|>"
  assistant_token: "<|start_header_id|>assistant<|end_header_id|>"

# 停止 Token
stop_tokens:
  - "<|eot_id|>"
  - "<|end_of_text|>"

# 所需内存
required_memory:
  min_gb: 4.0
  recommended_gb: 8.0
  max_gb: 16.0

# 性能指标
performance:
  mmlu: 0.69
  hellaswag: 0.83
  arc_challenge: 0.62
  truthfulqa: 0.43
  tokens_per_second: 85

# 文件信息
file_info:
  format: "gguf"
  recommended_file: "llama-3.1-8b-q4_k_m.gguf"
  sha256: "e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6"