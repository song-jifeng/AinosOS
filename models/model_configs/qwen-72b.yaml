# ============================================================
# Model Configuration
# ============================================================
model:
  name: "Qwen 72B"
  family: "qwen"
  architecture: "decoder-only"
  version: "1.0"
  description: "Alibaba's Qwen 72B large language model, pretrained on diverse multilingual data"

# ============================================================
# Source Information
# ============================================================
source:
  huggingface_repo: "Qwen/Qwen-72B"
  default_branch: "main"
  license: "tongyi-qianwen-license"
  paper_url: "https://arxiv.org/abs/2309.16609"
  author: "Alibaba Cloud"

# ============================================================
# Architecture Details
# ============================================================
architecture:
  num_layers: 80
  num_attention_heads: 64
  num_kv_heads: 64
  hidden_size: 8192
  intermediate_size: 24576
  vocab_size: 152064
  max_position_embeddings: 8192
  normalization: "RMSNorm"
  activation_function: "SiLU"
  attention_type: "multi-head-attention"
  positional_encoding: "RoPE"
  feed_forward: "SwiGLU"
  embedding_dim: 8192
  head_dim: 128
  rope_theta: 10000.0
  rope_scaling: null
  tie_word_embeddings: false
  weight_tying: false

# ============================================================
# Model Dimensions
# ============================================================
dimensions:
  total_params: "72B"
  non_embedding_params: "70B"
  embedding_params: "2B"
  model_size_gb: 144.0
  quantized_sizes:
    q4_0: 43.0
    q4_1: 47.0
    q5_0: 52.0
    q5_1: 57.0
    q8_0: 74.0
    f16: 144.0

# ============================================================
# Default Quantization
# ============================================================
quantization:
  default: "Q4_0"
  supported:
    - "Q4_0"
    - "Q4_1"
    - "Q5_0"
    - "Q5_1"
    - "Q8_0"
    - "F16"
  recommended: "Q4_0"
  performance_rank:
    Q4_0: "fastest, lowest quality"
    Q4_1: "slightly better quality than Q4_0"
    Q5_0: "good balance of quality and speed"
    Q5_1: "better quality than Q5_0"
    Q8_0: "near-lossless"
    F16: "lossless"

# ============================================================
# Recommended Parameters
# ============================================================
parameters:
  inference:
    temperature: 0.7
    top_p: 0.8
    top_k: 40
    repetition_penalty: 1.05
    max_tokens: 2048
    stop_sequences: []
  context_length: 8192
  batch_size: 1
  threads: 8
  gpu_layers: 0

# ============================================================
# Memory Requirements
# ============================================================
memory:
  minimum_ram_gb: 48
  recommended_ram_gb: 64
  minimum_vram_gb: 24
  recommended_vram_gb: 48
  swap_gb: 16
  disk_space_gb: 80
  breakdown:
    model_weights_gb: 144.0
    kv_cache_gb: 8.0
    overhead_gb: 4.0

# ============================================================
# Performance Benchmarks
# ============================================================
benchmarks:
  inference_speed:
    cpu:
      q4_0: { tokens_per_second: 3, prompt_processing: "50s for 512 tokens" }
      q8_0: { tokens_per_second: 1.8, prompt_processing: "85s for 512 tokens" }
      f16: { tokens_per_second: 0.7, prompt_processing: "170s for 512 tokens" }
    gpu:
      q4_0: { tokens_per_second: 20, prompt_processing: "8s for 512 tokens" }
      q8_0: { tokens_per_second: 14, prompt_processing: "12s for 512 tokens" }
      f16: { tokens_per_second: 8, prompt_processing: "20s for 512 tokens" }
  memory_usage:
    cpu:
      q4_0: { peak_ram_gb: 48, steady_ram_gb: 43 }
      q8_0: { peak_ram_gb: 80, steady_ram_gb: 74 }
      f16: { peak_ram_gb: 152, steady_ram_gb: 144 }
    gpu:
      q4_0: { peak_vram_gb: 45, peak_ram_gb: 6 }
      q8_0: { peak_vram_gb: 76, peak_ram_gb: 6 }
      f16: { peak_vram_gb: 146, peak_ram_gb: 6 }

# ============================================================
# Conversion Options
# ============================================================
conversion:
  supported_formats:
    - "gguf"
    - "onnx"
  default_format: "gguf"
  quantization_types:
    - "q4_0"
    - "q4_1"
    - "q5_0"
    - "q5_1"
    - "q8_0"
    - "f16"
  optimization_options:
    fuse_attention: true
    fuse_ffn: true
    prune_unused: false
  gguf_metadata:
    model_type: "qwen"
    file_version: 3
    tensor_data_layout: "default"

# ============================================================
# Hardware Requirements
# ============================================================
hardware:
  minimum:
    cpu: "x86_64, 8 cores"
    ram: "48 GB"
    disk: "SSD, 80 GB free"
  recommended:
    cpu: "x86_64, 16 cores with AVX-512"
    ram: "64 GB"
    gpu: "NVIDIA A100 80GB or multi-GPU setup"
    disk: "NVMe SSD, 200 GB free"
  supported_backends:
    - "cpu"
    - "cuda"
    - "vulkan"
    - "metal"

# ============================================================
# Dependencies
# ============================================================
dependencies:
  required:
    - "torch>=2.0.0"
    - "numpy>=1.24.0"
    - "safetensors>=0.3.0"
  optional:
    - "xformers>=0.0.20"
    - "flash-attn>=2.0.0"
    - "transformers>=4.31.0"
    - "accelerate>=0.20.0"

# ============================================================
# Registry Metadata
# ============================================================
registry:
  tags: ["llm", "text-generation", "qwen"]
  category: "text-generation"
  tasks: ["text-generation", "conversational"]
  languages: ["en", "zh"]
  featured: true
  created: "2023-08-03"
  updated: "2024-06-01"